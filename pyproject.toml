[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lobmod"
version = "1.5.0"
description = "High-frequency limit-order-book modeling: LOB simulator, Hawkes processes, deterministic MLP"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ashish Jha" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=5.0", "scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["python/src"]
include = ["lobmod*"]
