name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          # Windows checkout converts text to CRLF: proves data/ stays byte-exact.
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env:
          PYTHONPATH: src
      - run: python demo.py

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test --release

  cpp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: release, flags: "" }
          - { name: sanitize, flags: "-DLOBMOD_SANITIZE=ON" }
    name: cpp (${{ matrix.name }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpp
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: sudo apt-get update && sudo apt-get install -y junit4 libhamcrest-java
      - run: bash build.sh
      - run: bash test.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pattern is split so this file does not match itself.
      - name: Banned word check
        run: |
          if git grep -n -i 'inter''view'; then
            echo "banned word found" >&2
            exit 1
          fi
