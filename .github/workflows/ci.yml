name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          # Windows checkout converts text to CRLF: proves data/ stays byte-exact.
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt pytest pytest-cov
      # Coverage is reported, not enforced.
      - run: python -m pytest -q --cov=lobmod --cov-report=term
        env:
          PYTHONPATH: src
      - run: python demo.py
      - name: Package installs and imports from outside the tree
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --no-deps "${{ github.workspace }}"
          python -c "import lobmod, lobmod.feeds, lobmod.research, lobmod.sim; print(lobmod.__file__)"

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test --release

  cpp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: release, flags: "" }
          - { name: sanitize, flags: "-DLOBMOD_SANITIZE=ON" }
    name: cpp (${{ matrix.name }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpp
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: sudo apt-get update && sudo apt-get install -y junit4 libhamcrest-java
      - run: bash build.sh
      - run: bash test.sh

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: sh fuzz/run.sh 60
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: crash-*
          if-no-files-found: ignore

  # Advisory: findings show in the log and never fail the workflow.
  clang-tidy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - run: cmake -S cpp/fast -B build-tidy -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: clang-tidy -p build-tidy cpp/fast/bench.cpp cpp/fast/itch_bench.cpp cpp/fast/test_itch.cpp cpp/src/book.cpp

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The pattern is split so this file does not match itself.
      - name: Banned word check
        run: |
          if git grep -n -i 'inter''view'; then
            echo "banned word found" >&2
            exit 1
          fi
