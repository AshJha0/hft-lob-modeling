[package]
name = "lobmod"
version = "1.3.0"
edition = "2021"
description = "High-frequency limit-order-book modeling: LOB simulator, Hawkes processes, deterministic MLP"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The golden pipeline trains an 800-epoch full-batch MLP; unoptimized debug
# builds are far too slow for it, so tests/demo build with -O2 even in dev.
[profile.dev]
opt-level = 2

# Same arithmetic behaviour as dev: a wrap panics rather than passing silently.
[profile.release]
overflow-checks = true
